name: yasim_dev_doc
channels:
  - nodefaults
  - conda-forge
  - anaconda
  - bioconda
  - main
  - free

dependencies:
  # Core libraries in labw_utils
  - python=3.9
  - tk
  - numpy>=1.26 # Supported: 1.24.X, 1.25.X
  - pandas>=2.0 # Supported: 1.4.X, 1.5.X, 2.0.X
  - pysam>=0.21 # Supported: 0.20
  - joblib=>1.3 # Supported: 1.2.X
  - requests>=2.31 # Supported: 2.28.X
  - tomli-w>=1.0
  - tqdm>=4.66
  - scipy>=1.7
  - jinja2>=3.1.2
  - matplotlib>=3.8
  - pyarrow>=12.0.0 # Supported: 9.0.X
  - h5py # Maybe used in TE generation but not now. So relaxed.

  # Used in building docs
  - seaborn>=0.13.0


  # Sphinx documentation
  - sphinx=7.2
  - sphinx-copybutton
  - myst-nb
  - sphinxcontrib-bibtex
  - sphinx-design=0.5.0
  - furo=2023.9.10
#  - notebook
#  - jupyter
  - jupytext
  - anndata
  # Build utils
  - setuptools
